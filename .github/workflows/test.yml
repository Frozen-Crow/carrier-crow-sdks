name: SDK tests
on:
  push:
  pull_request:
  # Release runs the same suites before it publishes anything.
  workflow_call:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm run build
        working-directory: node
  python:
    # Python 3.9 binaries are available on this runner, unlike Ubuntu 26.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e './python[test]'
      - run: pytest python/tests -q
      - run: ruff check python
      - run: mypy --strict python/src/carriercrow
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go test ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        working-directory: php
      - run: composer test
        working-directory: php
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
      - run: ruby -Ilib test/client_test.rb
        working-directory: ruby
