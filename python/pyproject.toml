[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carriercrow"
version = "0.1.0"
description = "Carrier Crow HTTP API client"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.package-data]
carriercrow = ["py.typed"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
