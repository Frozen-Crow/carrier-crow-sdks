[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carriercrow"
version = "0.1.0"
description = "Carrier Crow email API client: send email, read what happened to it, and verify webhooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frozen Crow Inc." }]
keywords = ["email", "transactional email", "smtp", "webhooks", "carriercrow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://github.com/Frozen-Crow/carrier-crow-sdks/tree/main/python"
Source = "https://github.com/Frozen-Crow/carrier-crow-sdks"
Issues = "https://github.com/Frozen-Crow/carrier-crow-sdks/issues"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.package-data]
carriercrow = ["py.typed"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
